name: macOS Build

on:
  workflow_call:
    inputs:
      swift_versions:
        type: string
        description: "Swift version list (JSON)"
        default: '["6.2"]'

jobs:
  macos:
    name: macOS (Swift ${{ matrix.swift_version }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift_version: ${{ fromJson(inputs.swift_versions) }}
        include:
          - swift_version: "6.2"
            xcode_version: "26.2"
          - swift_version: "6.3"
            xcode_version: "26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode_version }}
        run: echo "DEVELOPER_DIR=/Applications/Xcode_${{ matrix.xcode_version }}.app" >> $GITHUB_ENV

      - name: Swift Version
        run: xcrun swift --version

      - name: Clang Version
        run: xcrun clang --version

      - name: Swift Build
        run: xcrun swift build
